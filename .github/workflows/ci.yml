name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Test Homebrew formula renderer
        run: python3 -m unittest discover -s packaging/homebrew -p 'test_*.py'
      - name: Test itch packaging and launchers
        run: python3 -m unittest discover -s packaging/itch -p 'test_*.py'
